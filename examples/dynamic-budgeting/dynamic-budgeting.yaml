# This is a local-development example. The ext_authz and UserInfo images are
# built from tests/internal and are intentionally not production identity
# services.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-ai-gateway-dynamic-budgeting
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-ai-gateway-dynamic-budgeting
  namespace: default
  annotations:
    aigateway.envoyproxy.io/gateway-config: envoy-ai-gateway-dynamic-budgeting
spec:
  gatewayClassName: envoy-ai-gateway-dynamic-budgeting
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-ai-gateway-dynamic-budgeting
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-ai-gateway-dynamic-budgeting
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources: {}
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: envoy-ai-gateway-dynamic-budgeting
  namespace: default
spec:
  globalLLMRequestCosts:
    # Fixed-point USD accounting: 1,000 millidollars = $1.00. The rates below
    # are intentionally large so the test upstream's 1 input + 1 output
    # response costs exactly $1.00.
    - metadataKey: llm_cost_millidollars
      type: CEL
      cel: "input_tokens * uint(200) + output_tokens * uint(800)"
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: envoy-ai-gateway-dynamic-budgeting
  namespace: default
spec:
  parentRefs:
    - name: envoy-ai-gateway-dynamic-budgeting
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: dynamic-budgeting-model
      backendRefs:
        - name: envoy-ai-gateway-dynamic-budgeting-testupstream
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-testupstream
  namespace: default
spec:
  schema:
    name: OpenAI
  backendRef:
    name: envoy-ai-gateway-dynamic-budgeting-testupstream
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-testupstream
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: envoy-ai-gateway-dynamic-budgeting-testupstream.default.svc.cluster.local
        port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-extauth
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ai-gateway-dynamic-budgeting
  extAuth:
    grpc:
      backendRefs:
        - name: envoy-ai-gateway-dynamic-budgeting-extauth
          port: 1073
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-ai-gateway-dynamic-budgeting
  namespace: default
spec:
  targetRefs:
    - name: envoy-ai-gateway-dynamic-budgeting
      kind: Gateway
      group: gateway.networking.k8s.io
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-quota-scope-type
                  type: Exact
                  value: user
                - name: x-quota-scope-id
                  type: Distinct
          limit:
            # The fallback unit must be supported by the generated RLS config. Authorized
            # requests override this with the daily unit from ext_authz metadata.
            requests: 4
            unit: Hour
            fromMetadata:
              namespace: envoy.filters.http.ext_authz
              key: user_millidollar_daily_limit
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_cost_millidollars
        - clientSelectors:
            - headers:
                - name: x-quota-scope-type
                  type: Exact
                  value: user
                - name: x-quota-scope-id
                  type: Distinct
          limit:
            # Authorized requests override this with the monthly unit from ext_authz metadata.
            requests: 4
            unit: Hour
            fromMetadata:
              namespace: envoy.filters.http.ext_authz
              key: user_millidollar_monthly_limit
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_cost_millidollars
        - clientSelectors:
            - headers:
                - name: x-quota-scope-type
                  type: Exact
                  value: project
                - name: x-quota-scope-id
                  type: Distinct
          limit:
            # Shared project allocation fallback; authorized requests override the unit.
            requests: 4
            unit: Hour
            fromMetadata:
              namespace: envoy.filters.http.ext_authz
              key: project_millidollar_daily_limit
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_cost_millidollars
        - clientSelectors:
            - headers:
                - name: x-quota-scope-type
                  type: Exact
                  value: project
                - name: x-quota-scope-id
                  type: Distinct
          limit:
            # Shared project allocation fallback; authorized requests override the unit.
            requests: 4
            unit: Hour
            fromMetadata:
              namespace: envoy.filters.http.ext_authz
              key: project_millidollar_monthly_limit
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_cost_millidollars
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-extauth
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-dynamic-budgeting-extauth
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-dynamic-budgeting-extauth
    spec:
      containers:
        - name: ext-authz
          image: docker.io/envoyproxy/ai-gateway-testextauthserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1073
          env:
            - name: EXT_AUTH_MODE
              value: jwt-userinfo
            - name: EXT_AUTH_JWT_SECRET
              value: local-development-secret
            - name: EXT_AUTH_USERINFO_URL
              value: http://envoy-ai-gateway-dynamic-budgeting-userinfo:1080/userinfo
            - name: EXT_AUTH_USER_DAILY_METADATA_KEY
              value: user_millidollar_daily_limit
            - name: EXT_AUTH_USER_MONTHLY_METADATA_KEY
              value: user_millidollar_monthly_limit
            - name: EXT_AUTH_PROJECT_DAILY_METADATA_KEY
              value: project_millidollar_daily_limit
            - name: EXT_AUTH_PROJECT_MONTHLY_METADATA_KEY
              value: project_millidollar_monthly_limit
            - name: EXT_AUTH_TIER_LIMITS
              value: |
                {
                  "premium": {
                    "daily": {"requests_per_unit": 6000, "unit": "DAY"},
                    "monthly": {"requests_per_unit": 60000, "unit": "MONTH"}
                  },
                  "basic": {
                    "daily": {"requests_per_unit": 2000, "unit": "DAY"},
                    "monthly": {"requests_per_unit": 20000, "unit": "MONTH"}
                  },
                  "suspended": {
                    "daily": {"requests_per_unit": 0, "unit": "DAY"},
                    "monthly": {"requests_per_unit": 0, "unit": "MONTH"}
                  }
                }
            - name: EXT_AUTH_PROJECT_LIMITS
              value: |
                {
                  "project-123": {
                    "daily": {"requests_per_unit": 10000, "unit": "DAY"},
                    "monthly": {"requests_per_unit": 100000, "unit": "MONTH"}
                  }
                }
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-extauth
  namespace: default
spec:
  selector:
    app: envoy-ai-gateway-dynamic-budgeting-extauth
  ports:
    - name: grpc
      port: 1073
      targetPort: 1073
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-userinfo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-dynamic-budgeting-userinfo
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-dynamic-budgeting-userinfo
    spec:
      containers:
        - name: userinfo
          image: docker.io/envoyproxy/ai-gateway-testuserinfoserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1080
          env:
            - name: USERINFO_DEFAULT
              value: '{"sub":"local-user","tier":"premium","projects":["project-123"]}'
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-userinfo
  namespace: default
spec:
  selector:
    app: envoy-ai-gateway-dynamic-budgeting-userinfo
  ports:
    - name: http
      port: 1080
      targetPort: 1080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-testupstream
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ai-gateway-dynamic-budgeting-testupstream
  template:
    metadata:
      labels:
        app: envoy-ai-gateway-dynamic-budgeting-testupstream
    spec:
      containers:
        - name: testupstream
          image: docker.io/envoyproxy/ai-gateway-testupstream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ai-gateway-dynamic-budgeting-testupstream
  namespace: default
spec:
  selector:
    app: envoy-ai-gateway-dynamic-budgeting-testupstream
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
